<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBX2Animation</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0f0f1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #eee; }
#app { width: 100vw; height: 100vh; position: relative; }
canvas { display: block; }

#welcome {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3e 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 500; transition: opacity 0.5s;
}
#welcome.hidden { opacity: 0; pointer-events: none; }
#welcome h1 { font-size: 2.5rem; margin-bottom: 8px; background: linear-gradient(90deg,#4f8ef7,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
#welcome p { color: #888; margin-bottom: 40px; }
#drop-zone {
  width: 360px; height: 200px; border: 2px dashed #4f8ef7; border-radius: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; background: rgba(79,142,247,0.05);
}
#drop-zone:hover, #drop-zone.drag-over { background: rgba(79,142,247,0.15); border-color: #a78bfa; transform: scale(1.02); }
#drop-zone .dz-icon { font-size: 3rem; margin-bottom: 12px; }
#drop-zone .dz-text { color: #aaa; text-align: center; line-height: 1.6; }
#drop-zone .dz-hint { color: #555; font-size: 0.8rem; margin-top: 8px; }

#statusbar {
  position: fixed; top: 0; left: 0; right: 0; height: 40px;
  background: rgba(15,15,26,0.9); backdrop-filter: blur(8px);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
  z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.8rem; color: #888;
}
#statusbar .title { color: #ccc; font-weight: 600; }
#statusbar #file-info { flex: 1; }
#statusbar #load-btn {
  background: #4f8ef7; color: #fff; border: none; padding: 5px 14px;
  border-radius: 6px; cursor: pointer; font-size: 0.8rem;
}
#statusbar #load-btn:hover { background: #3a7bd5; }

#gui-panel {
  position: fixed; right: 16px; top: 56px; width: 260px;
  background: rgba(15,15,26,0.93); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
  overflow: hidden; z-index: 100; display: none;
}
.gui-header {
  padding: 10px 14px; background: rgba(79,142,247,0.12);
  font-size: 0.8rem; font-weight: 600; color: #a0bcf7;
  cursor: pointer; display: flex; justify-content: space-between; user-select: none;
}
.gui-header:hover { background: rgba(79,142,247,0.22); }
.gui-body { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.gui-body.collapsed { display: none; }
.gui-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gui-label { font-size: 0.75rem; color: #888; white-space: nowrap; flex-shrink: 0; }
.gui-row input[type=range] { flex: 1; accent-color: #4f8ef7; cursor: pointer; }
.gui-row select { flex: 1; background: #1a1a2e; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; cursor: pointer; }
.gui-row input[type=checkbox] { accent-color: #4f8ef7; cursor: pointer; width: 14px; height: 14px; }
.gui-val { font-size: 0.7rem; color: #4f8ef7; width: 32px; text-align: right; }
.gui-btn-row { display: flex; gap: 6px; }
.gui-btn { flex: 1; background: rgba(79,142,247,0.12); color: #a0bcf7; border: 1px solid rgba(79,142,247,0.25); border-radius: 6px; padding: 5px 6px; font-size: 0.72rem; cursor: pointer; transition: all 0.15s; }
.gui-btn:hover { background: rgba(79,142,247,0.28); }
.gui-btn.active { background: #4f8ef7; color: #fff; border-color: #4f8ef7; }
.gui-divider { height: 1px; background: rgba(255,255,255,0.06); }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.info-cell { background: rgba(255,255,255,0.04); border-radius: 6px; padding: 6px 8px; text-align: center; }
.info-cell .val { font-size: 0.9rem; font-weight: 600; color: #4f8ef7; }
.info-cell .key { font-size: 0.65rem; color: #555; margin-top: 2px; }

#prog-wrap { position: fixed; bottom: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.05); z-index: 200; display: none; }
#prog-bar { height: 100%; background: linear-gradient(90deg,#4f8ef7,#a78bfa); width: 0%; transition: width 0.1s; }
#drag-overlay { position: fixed; inset: 0; background: rgba(79,142,247,0.1); border: 3px dashed #4f8ef7; z-index: 400; display: none; align-items: center; justify-content: center; font-size: 1.5rem; color: #4f8ef7; font-weight: 600; pointer-events: none; }
#drag-overlay.active { display: flex; }
#file-input { display: none; }
</style>
  <script type="module" crossorigin src="/assets/index-DexVhQrP.js"></script>
</head>
<body>
<div id="app">
  <div id="welcome">
    <h1>FBX2Animation</h1>
    <p>Three.js FBX 动画播放器</p>
    <div id="drop-zone">
      <div class="dz-icon">📦</div>
      <div class="dz-text">拖拽 FBX 文件到这里<br>或点击选择文件</div>
      <div class="dz-hint">支持包含骨骼动画的 .fbx 文件</div>
    </div>
  </div>
  <div id="drag-overlay">📦 松开导入 FBX</div>
  <div id="statusbar">
    <span class="title">FBX2Animation</span>
    <span id="file-info">未加载模型</span>
    <button id="load-btn">📂 导入FBX</button>
  </div>
  <div id="gui-panel">
    <div class="gui-header" onclick="toggleSection('anim')">🎬 动画控制 <span id="arrow-anim">▼</span></div>
    <div class="gui-body" id="body-anim">
      <div class="gui-row">
        <span class="gui-label">当前动画</span>
        <select id="anim-select" onchange="switchAnim(this.value)"></select>
      </div>
      <div class="gui-row">
        <span class="gui-label">速度</span>
        <input type="range" id="speed-slider" min="0.1" max="3" step="0.05" value="1" oninput="setSpeed(this.value)">
        <span class="gui-val" id="speed-val">1.0x</span>
      </div>
      <div class="gui-btn-row">
        <button class="gui-btn active" id="btn-play" onclick="togglePlay()">⏸ 暂停</button>
        <button class="gui-btn" onclick="resetAnim()">⏮ 重置</button>
        <button class="gui-btn active" id="btn-loop" onclick="toggleLoop()">🔁 循环</button>
      </div>
      <div class="gui-row">
        <span class="gui-label">进度</span>
        <input type="range" id="prog-slider" min="0" max="1" step="0.001" value="0" oninput="seekAnim(this.value)">
        <span class="gui-val" id="time-val">0.0s</span>
      </div>
    </div>
    <div class="gui-divider"></div>
    <div class="gui-header" onclick="toggleSection('info')">📊 模型信息 <span id="arrow-info">▼</span></div>
    <div class="gui-body" id="body-info">
      <div class="info-grid">
        <div class="info-cell"><div class="val" id="info-meshes">-</div><div class="key">网格数</div></div>
        <div class="info-cell"><div class="val" id="info-polys">-</div><div class="key">面数</div></div>
        <div class="info-cell"><div class="val" id="info-anims">-</div><div class="key">动画数</div></div>
        <div class="info-cell"><div class="val" id="info-bones">-</div><div class="key">骨骼数</div></div>
      </div>
    </div>
    <div class="gui-divider"></div>
    <div class="gui-header" onclick="toggleSection('scene')">🌍 场景 <span id="arrow-scene">▼</span></div>
    <div class="gui-body" id="body-scene">
      <div class="gui-row"><span class="gui-label">显示地面</span><input type="checkbox" checked onchange="ground.visible=this.checked"></div>
      <div class="gui-row"><span class="gui-label">显示网格</span><input type="checkbox" checked onchange="gridHelper.visible=this.checked"></div>
      <div class="gui-row"><span class="gui-label">线框模式</span><input type="checkbox" onchange="toggleWire(this.checked)"></div>
      <div class="gui-row"><span class="gui-label">显示骨骼</span><input type="checkbox" onchange="toggleSkeleton(this.checked)"></div>
      <div class="gui-btn-row"><button class="gui-btn" onclick="resetCamera()">📷 重置视角</button></div>
    </div>
    <div class="gui-divider"></div>
    <div class="gui-header" onclick="toggleSection('light')">💡 灯光 <span id="arrow-light">▼</span></div>
    <div class="gui-body" id="body-light">
      <div class="gui-row">
        <span class="gui-label">环境光</span>
        <input type="range" min="0" max="3" step="0.05" value="0.6" oninput="ambient.intensity=+this.value;document.getElementById('amb-val').textContent=(+this.value).toFixed(1)">
        <span class="gui-val" id="amb-val">0.6</span>
      </div>
      <div class="gui-row">
        <span class="gui-label">主光源</span>
        <input type="range" min="0" max="4" step="0.05" value="1.2" oninput="dirLight.intensity=+this.value;document.getElementById('dir-val').textContent=(+this.value).toFixed(1)">
        <span class="gui-val" id="dir-val">1.2</span>
      </div>
      <div class="gui-row">
        <span class="gui-label">背景色</span>
        <input type="color" value="#0f0f1a" oninput="scene.background=new THREE.Color(this.value)" style="flex:1;height:24px;border:none;background:none;cursor:pointer;">
      </div>
    </div>
  </div>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <input type="file" id="file-input" accept=".fbx">
</div>
</body>
</html>
